name: capture
run-name: clip-capture|${{ inputs.platform }}|${{ inputs.channel }}

# One capture agent. It monitors its assigned channel until that live ends,
# then automatically switches to the next live channel from the pool.
# The run title is the agent's claim — other agents read it to avoid
# capturing the same stream.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "twitch | kick | youtube"
        required: true
      channel:
        description: "Channel name / handle"
        required: true
      threshold:
        description: "Override threshold (e.g. -1 forces a test clip)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # stay under the 6h GitHub hard limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install capture deps
        run: |
          sudo apt-get update -qq
          # NOTE: ffmpeg is NOT preinstalled on current runner images
          sudo apt-get install -y -qq ffmpeg rclone
          pip install -r requirements-capture.txt
          ffmpeg -version | head -1
          streamlink --version | head -1
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ vars.WHISPER_MODEL || 'base' }}
      - name: Restore rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "${{ secrets.GDRIVE_RCLONE_CONF }}" ]; then
            echo "${{ secrets.GDRIVE_RCLONE_CONF }}" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
          else
            echo "WARNING: GDRIVE_RCLONE_CONF not set — clips will be kept locally only"
          fi
      - name: Capture stream
        run: |
          python -m streamclip.capture \
            --platform "${{ inputs.platform }}" \
            --channel "${{ inputs.channel }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCF_THRESHOLD: ${{ inputs.threshold }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
