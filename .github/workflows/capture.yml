name: capture
run-name: clip-capture|${{ inputs.platform }}|${{ inputs.channel != '' && inputs.channel || 'auto' }}|${{ inputs.slot }}

# One capture agent slot (e.g. twitch-1 … youtube-3, or "manual"). The agent
# monitors a channel until that live ends, then switches to the next live
# channel of ITS platform and keeps going. When nothing of its platform is
# live it exits quickly and the monitor re-launches enabled slots.
# The run title is the agent's claim — other agents never double-capture.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "twitch | kick | youtube"
        required: true
      slot:
        description: "Agent slot id (twitch-1 … youtube-3, manual)"
        required: false
        default: "manual"
      channel:
        description: "Channel to capture first (empty = pick from the pool)"
        required: false
        default: ""
      threshold:
        description: "Override threshold (e.g. -1 forces a test clip)"
        required: false
        default: ""

concurrency:
  group: capture-${{ inputs.slot }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # stay under the 6h GitHub hard limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache CLI binaries
        uses: actions/cache@v4
        with:
          path: ~/.scf-bin
          key: cli-${{ runner.os }}-ffmpeg7-rclone
      - name: Install capture deps
        run: |
          # Static ffmpeg + rclone (cached) — no apt, capture starts in ~30 s
          mkdir -p ~/.scf-bin
          if [ ! -x ~/.scf-bin/ffmpeg ]; then
            curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg-static
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            cp /tmp/ffmpeg-static/ffmpeg /tmp/ffmpeg-static/ffprobe ~/.scf-bin/
          fi
          if [ ! -x ~/.scf-bin/rclone ]; then
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip \
              -o /tmp/rclone.zip
            mkdir -p /tmp/rclone-static
            unzip -q -o /tmp/rclone.zip -d /tmp/rclone-static
            cp /tmp/rclone-static/rclone-*/rclone ~/.scf-bin/
          fi
          chmod +x ~/.scf-bin/*
          echo "$HOME/.scf-bin" >> "$GITHUB_PATH"
          pip install -q -r requirements-capture.txt
          ~/.scf-bin/ffmpeg -version | head -1
          streamlink --version | head -1
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ vars.WHISPER_MODEL || 'base' }}
      - name: Restore rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "${{ secrets.GDRIVE_RCLONE_CONF }}" ]; then
            echo "${{ secrets.GDRIVE_RCLONE_CONF }}" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
          else
            echo "WARNING: GDRIVE_RCLONE_CONF not set — clips will be kept locally only"
          fi
      - name: Start AI judge in background
        run: |
          cat > /tmp/ai_setup.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          MODEL="$1"
          BIN="$HOME/.scf-ollama/bin/ollama"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$HOME/.scf-ollama"
            if curl -fsSL https://ollama.com/download/ollama-linux-amd64.tgz \
                 -o /tmp/ollama.tgz; then
              tar -xzf /tmp/ollama.tgz -C "$HOME/.scf-ollama" || true
            fi
            if [ ! -x "$BIN" ]; then
              curl -fsSL https://ollama.com/install.sh | sh
              BIN="$(command -v ollama)"
            fi
          fi
          nohup "$BIN" serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version >/dev/null && break
            sleep 1
          done
          "$BIN" pull "$MODEL" || echo "WARNING: model pull failed"
          echo "AI judge ready: $MODEL"
          SH
          chmod +x /tmp/ai_setup.sh
          nohup /tmp/ai_setup.sh "${{ vars.AI_MODEL || 'qwen2.5:3b-instruct' }}" \
            > /tmp/ai_setup.log 2>&1 &
          echo "AI setup running in background — capture starts immediately"
      - name: Capture stream
        run: |
          python -m streamclip.capture \
            --platform "${{ inputs.platform }}" \
            --slot "${{ inputs.slot }}" \
            --channel "${{ inputs.channel }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BASE_URL: http://localhost:11434/v1
          AI_MODEL: ${{ vars.AI_MODEL || 'qwen2.5:3b-instruct' }}
          SCF_THRESHOLD: ${{ inputs.threshold }}
          SCF_PROBE_TIMEOUT: "45"
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
