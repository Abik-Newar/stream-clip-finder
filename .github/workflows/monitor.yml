name: monitor
run-name: monitor

# Keeps the nine agent slots alive (per dashboard-data/agents.json) and
# purges expired dashboard tasks. START/STOP workflows enable/disable this
# scheduler as the master switch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    if: vars.SCF_RUNNING != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: API budget
        run: |
          gh api rate_limit --jq '.resources.core | "core API: \(.remaining)/\(.limit) left"'
      - name: Nurse agent slots
        run: python -m streamclip.monitor
      - name: Purge dashboard tasks older than 3 days
        run: python -m streamclip.dashboard_cleanup
