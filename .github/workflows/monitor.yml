name: monitor
run-name: monitor

# Manual mode: agents are ONLY started by pasting a link and pressing Watch
# on the dashboard. This scheduler no longer dispatches capture agents — it
# only purges old dashboard tasks (and keeps the workflow name stable).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: vars.SCF_RUNNING != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Purge dashboard tasks older than 3 days
        run: python -m streamclip.dashboard_cleanup
