name: start
run-name: stream-clip ▶ START

# One-click START: enables the scheduler and immediately checks channels.
# Run from the Actions tab → "stream-clip ▶ START" → Run workflow.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Turn the system on
        run: |
          set +e
          REPO="${{ github.repository }}"
          echo "-> enabling the monitor scheduler"
          gh workflow enable monitor.yml --repo "$REPO" \
            || echo "   (needs admin perms — the master switch below still governs)"
          echo "-> setting the master switch"
          gh variable set SCF_RUNNING --body "true" --repo "$REPO" \
            || echo "   (variable not permitted — set it in Settings > Actions > Variables)"
          echo "-> enabling every agent slot (agents.json)"
          python3 - <<'PY'
          import base64, json, os, subprocess
          from urllib.request import Request, urlopen
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = subprocess.run(["gh", "auth", "token"],
                               capture_output=True, text=True).stdout.strip()
          path = "dashboard-data/agents.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          hdr = {"Authorization": f"Bearer {tok}",
                 "Accept": "application/vnd.github+json"}
          sha = None
          try:
              with urlopen(Request(url, headers=hdr), timeout=30) as r:
                  sha = json.load(r)["sha"]
          except Exception:
              pass
          try:
              doc = json.load(open(path))
          except Exception:
              doc = {}
          doc["slots"] = {k: {"enabled": True} for k in doc.get("slots", {})}
          payload = {"message": "agents: master start — all slots enabled",
                     "content": base64.b64encode(
                         (json.dumps(doc, indent=2) + "\n").encode()).decode()}
          if sha:
              payload["sha"] = sha
          req = Request(url, data=json.dumps(payload).encode(),
                        headers={**hdr, "Content-Type": "application/json"},
                        method="PUT")
          try:
              urlopen(req, timeout=30)
              print("   all agent slots enabled")
          except Exception as e:
              print(f"   (agents.json update failed: {e})")
          PY
          sleep 5
          echo "-> running an immediate slot check"
          if gh workflow run monitor.yml --repo "$REPO"; then
            echo "▶ SYSTEM ON — enabled agent slots are spinning up"
          else
            echo "   (monitor dispatch failed)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
