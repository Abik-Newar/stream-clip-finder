name: stop
run-name: stream-clip ■ STOP

# One-click STOP: disables the scheduler and kills every running agent.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Turn the system off and cancel running agents
        # set +e: every step is best-effort — STOP must never fail halfway
        run: |
          set +e
          REPO="${{ github.repository }}"
          echo "-> disabling the monitor scheduler"
          gh workflow disable monitor.yml --repo "$REPO" \
            || echo "   (needs admin perms — the master switch below still governs)"
          echo "-> clearing the master switch"
          gh variable set SCF_RUNNING --body "false" --repo "$REPO" \
            || echo "   (variable not permitted — set it in Settings > Actions > Variables)"
          echo "-> disabling every agent slot (agents.json)"
          python3 - <<'PY'
          import base64, json, os, subprocess
          from urllib.request import Request, urlopen
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = subprocess.run(["gh", "auth", "token"],
                               capture_output=True, text=True).stdout.strip()
          path = "dashboard-data/agents.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          hdr = {"Authorization": f"Bearer {tok}",
                 "Accept": "application/vnd.github+json"}
          sha = None
          try:
              with urlopen(Request(url, headers=hdr), timeout=30) as r:
                  sha = json.load(r)["sha"]
          except Exception:
              pass
          try:
              doc = json.load(open(path))
          except Exception:
              doc = {}
          doc["slots"] = {k: {**(v if isinstance(v, dict) else {}), "enabled": False} for k, v in doc.get("slots", {}).items()}
          payload = {"message": "agents: master stop — all slots disabled",
                     "content": base64.b64encode(
                         (json.dumps(doc, indent=2) + "\n").encode()).decode()}
          if sha:
              payload["sha"] = sha
          req = Request(url, data=json.dumps(payload).encode(),
                        headers={**hdr, "Content-Type": "application/json"},
                        method="PUT")
          try:
              urlopen(req, timeout=30)
              print("   all agent slots disabled")
          except Exception as e:
              print(f"   (agents.json update failed: {e})")
          PY
          echo "-> cancelling running capture agents"
          ids=$(gh run list --workflow capture.yml --repo "$REPO" --limit 60 \
                 --json databaseId,status \
                 --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' 2>/dev/null)
          n=0
          for id in $ids; do
            if gh run cancel "$id" --repo "$REPO" >/dev/null 2>&1; then
              echo "   cancelled run $id"
              n=$((n+1))
            fi
          done
          sleep 8
          echo "-> second sweep (a dispatch may have raced the stop)"
          ids2=$(gh run list --workflow capture.yml --repo "$REPO" --limit 60 \
                   --json databaseId,status \
                   --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' 2>/dev/null)
          for id in $ids2; do
            if gh run cancel "$id" --repo "$REPO" >/dev/null 2>&1; then
              echo "   cancelled run $id"
              n=$((n+1))
            fi
          done
          echo "■ SYSTEM OFF — scheduler disabled, $n capture agent(s) cancelled"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
