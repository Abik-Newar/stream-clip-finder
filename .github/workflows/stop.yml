name: stop
run-name: stream-clip ■ STOP

# One-click STOP: disables the scheduler and kills every running agent.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Turn the system off and cancel running agents
        # set +e: every step is best-effort — STOP must never fail halfway
        run: |
          set +e
          echo "-> disabling the monitor scheduler"
          gh workflow disable monitor.yml || echo "   (monitor was already disabled)"
          echo "-> clearing the master switch"
          gh variable set SCF_RUNNING --body "false" || echo "   (variable not permitted — workflow disable still governs)"
          echo "-> cancelling running capture agents"
          ids=$(gh run list --workflow capture.yml --limit 60 \
                 --json databaseId,status \
                 --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' 2>/dev/null)
          n=0
          for id in $ids; do
            if gh run cancel "$id" >/dev/null 2>&1; then
              echo "   cancelled run $id"
              n=$((n+1))
            fi
          done
          echo "■ SYSTEM OFF — scheduler disabled, $n capture agent(s) cancelled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
