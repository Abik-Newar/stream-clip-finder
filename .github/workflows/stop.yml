name: stop
run-name: stream-clip ■ STOP

# One-click STOP: disables the scheduler and kills every running agent.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Turn the system off and cancel running agents
        run: |
          gh variable set SCF_RUNNING --body "false" 2>/dev/null || true
          gh workflow disable monitor.yml 2>/dev/null || true
          ids=$(gh run list --workflow capture.yml --limit 60 \
                 --json databaseId,status \
                 --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId')
          n=0
          for id in $ids; do
            gh run cancel "$id" 2>/dev/null && n=$((n+1)) || true
          done
          echo "■ SYSTEM OFF — scheduler disabled, $n capture agent(s) cancelled"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
