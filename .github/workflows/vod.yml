name: vod
run-name: non-realtime|${{ inputs.url }}

# One finished YouTube video, clipped on demand. This is deliberately NOT a
# capture agent: it does not watch, claim a creator, or dispatch anything by
# itself. The dashboard's Non-realtime tile sends exactly one video link.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube video link (watch / shorts / youtu.be)"
        required: true
      dry_run:
        description: "Run the whole pipeline but do not upload or publish"
        type: boolean
        default: false

concurrency:
  # One non-realtime job at a time. A new link replaces the old job so the
  # public repo never accumulates a queue of long downloads.
  group: non-realtime
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  vod:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Deno (YouTube JS challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache CLI binaries
        uses: actions/cache@v4
        with:
          path: ~/.scf-bin
          key: cli-${{ runner.os }}-ffmpeg8-rclone
      - name: Install non-realtime deps
        run: |
          mkdir -p ~/.scf-bin
          if [ ! -x ~/.scf-bin/ffmpeg ]; then
            for i in 1 2 3; do
              curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                -o /tmp/ffmpeg.tar.xz || { sleep 3; continue; }
              rm -rf /tmp/ffmpeg-static && mkdir -p /tmp/ffmpeg-static
              if tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1 2>/dev/null; then
                cp /tmp/ffmpeg-static/bin/ffmpeg /tmp/ffmpeg-static/bin/ffprobe ~/.scf-bin/ && break
              fi
              echo "ffmpeg download attempt $i was corrupt — retrying"
              sleep 3
            done
            [ -x ~/.scf-bin/ffmpeg ] || { echo "FATAL: could not fetch ffmpeg"; exit 1; }
          fi
          if [ ! -x ~/.scf-bin/rclone ]; then
            for i in 1 2 3; do
              curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip \
                -o /tmp/rclone.zip || { sleep 3; continue; }
              rm -rf /tmp/rclone-static && mkdir -p /tmp/rclone-static
              if unzip -q -o /tmp/rclone.zip -d /tmp/rclone-static 2>/dev/null; then
                cp /tmp/rclone-static/rclone-*/rclone ~/.scf-bin/ && break
              fi
              echo "rclone download attempt $i was corrupt — retrying"
              sleep 3
            done
            [ -x ~/.scf-bin/rclone ] || { echo "FATAL: could not fetch rclone"; exit 1; }
          fi
          chmod +x ~/.scf-bin/*
          echo "$HOME/.scf-bin" >> "$GITHUB_PATH"
          pip install -q -r requirements-capture.txt
          ~/.scf-bin/ffmpeg -version | head -1
          yt-dlp --version
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ vars.WHISPER_MODEL || 'small' }}
      - name: Restore rclone config
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "${{ secrets.GDRIVE_RCLONE_CONF }}" ]; then
            echo "${{ secrets.GDRIVE_RCLONE_CONF }}" | base64 -d > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
          else
            echo "WARNING: GDRIVE_RCLONE_CONF not set — clips will be kept locally only"
          fi
      - name: Start AI judge in background
        run: |
          cat > /tmp/ai_setup.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          MODEL="$1"
          BIN="$HOME/.scf-ollama/bin/ollama"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$HOME/.scf-ollama"
            if curl -fsSL \
                 https://github.com/ollama/ollama/releases/latest/download/ollama-linux-amd64.tar.zst \
                 -o /tmp/ollama.tar.zst; then
              tar --zstd -xf /tmp/ollama.tar.zst -C "$HOME/.scf-ollama" || true
            fi
            if [ ! -x "$BIN" ]; then
              curl -fsSL https://ollama.com/install.sh | sh
              BIN="$(command -v ollama)"
            fi
          fi
          nohup "$BIN" serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/version >/dev/null && break
            sleep 1
          done
          "$BIN" pull "$MODEL" || echo "WARNING: model pull failed"
          echo "AI judge ready: $MODEL"
          SH
          chmod +x /tmp/ai_setup.sh
          nohup /tmp/ai_setup.sh "${{ vars.AI_MODEL || 'qwen2.5:3b-instruct' }}" \
            > /tmp/ai_setup.log 2>&1 &
          echo "AI setup running in background — download starts immediately"
      - name: Clip the video
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="--no-upload"; fi
          python -m streamclip.vod --url "${{ inputs.url }}" $EXTRA
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BASE_URL: http://localhost:11434/v1
          AI_MODEL: ${{ vars.AI_MODEL || 'qwen2.5:3b-instruct' }}
          SCF_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
