name: yt-probe
run-name: YouTube extraction probe (Deno + EJS solver)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Decode cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          echo "$YT_COOKIES" | base64 -d > /tmp/yt.txt
          echo "cookies: PRESENT ($(wc -l < /tmp/yt.txt) lines)"
      - name: Install yt-dlp with solver scripts
        run: |
          pip install -q -U "yt-dlp[default]"
          echo "yt-dlp $(yt-dlp --version)"
          deno --version | head -1
          pip list 2>/dev/null | grep -i ejs || true
      - name: Probe clients (Deno + EJS)
        run: |
          URL="https://www.youtube.com/@LofiGirl/live"
          for CLIENT in default tv web web_safari mweb; do
            echo "=== client: $CLIENT ==="
            ARGS=()
            if [ "$CLIENT" != "default" ]; then
              ARGS=(--extractor-args "youtube:player_client=$CLIENT")
            fi
            if yt-dlp -g -f "bv*+ba/b" --no-warnings --cookies /tmp/yt.txt \
                 "${ARGS[@]}" "$URL" > /tmp/out 2>/tmp/err; then
              echo "OK  $(head -c 90 /tmp/out)"
            else
              echo "FAIL $(tail -1 /tmp/err | cut -c1-220)"
            fi
          done
      - name: Regular (non-live) video
        run: |
          yt-dlp -g -f "bv*+ba/b" --no-warnings --cookies /tmp/yt.txt \
            "https://www.youtube.com/watch?v=aqz-KE-bpKQ" 2>&1 | tail -1 | cut -c1-200
      - name: Verbose JS-challenge lines
        run: |
          yt-dlp -v -g -f "bv*+ba/b" --cookies /tmp/yt.txt \
            "https://www.youtube.com/@LofiGirl/live" 2>&1 \
            | grep -iE "jsc|ejs|challenge|pot|format" | cut -c1-240 | head -30

  pot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Decode cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: echo "$YT_COOKIES" | base64 -d > /tmp/yt.txt
      - name: Start PO-token provider (docker)
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4416/ping >/dev/null && break
            sleep 2
          done
          echo "ping: $(curl -s http://127.0.0.1:4416/ping)"
      - name: Install yt-dlp + plugin
        run: |
          pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          yt-dlp --version
      - name: Extract with JS solver + PO tokens
        run: |
          URL="https://www.youtube.com/@LofiGirl/live"
          for CLIENT in default web tv; do
            echo "=== client: $CLIENT ==="
            ARGS=()
            if [ "$CLIENT" != "default" ]; then
              ARGS=(--extractor-args "youtube:player_client=$CLIENT")
            fi
            if yt-dlp -g -f "bv*+ba/b" --no-warnings --cookies /tmp/yt.txt \
                 "${ARGS[@]}" "$URL" > /tmp/out 2>/tmp/err; then
              echo "OK  $(head -c 90 /tmp/out)"
            else
              echo "FAIL $(tail -1 /tmp/err | cut -c1-220)"
            fi
          done
      - name: Verify token generation
        run: |
          yt-dlp -v -g -f "bv*+ba/b" --cookies /tmp/yt.txt \
            "https://www.youtube.com/@LofiGirl/live" 2>&1 \
            | grep -iE "jsc|pot|token|challenge" | cut -c1-240 | head -25
