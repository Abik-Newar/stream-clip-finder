# Channel pool. The agents take channels from this list in priority order.
#
# HOW IT WORKS
#   • The monitor dispatches one capture agent per live channel (up to
#     max_concurrent).
#   • Each agent monitors its channel for the WHOLE live. When that live
#     ends, the agent automatically switches to the next live channel in this
#     list and keeps going — nothing needs to be restarted by hand.
#   • Agents claim channels via their workflow-run title, so two agents never
#     capture the same stream.
#   • `enabled: false` takes a channel out of rotation without deleting it.
#
# Add your real channels below — top of the list = highest priority.

channels:
  # --- Twitch (top of list = highest priority) ---
  - platform: twitch
    name: xqc
    enabled: true
  - platform: twitch
    name: summit1g
    enabled: true
  - platform: twitch
    name: jynxzi
    enabled: true
  - platform: twitch
    name: tarik
    enabled: true
  - platform: twitch
    name: nightblue3
    enabled: true

  # --- Kick: picked up automatically whenever they are live ---
  - platform: kick
    name: xqc
    enabled: true
  - platform: kick
    name: rachitroo_1
    enabled: true
  - platform: kick
    name: trainwreckstv
    enabled: true
  - platform: kick
    name: iceposeidon
    enabled: true
  - platform: kick
    name: adinross
    enabled: true
  - platform: kick
    name: n3on
    enabled: true

  # --- YouTube: needs the YT_COOKIES secret on datacenter runners ---
  - platform: youtube
    name: "@SkyNews"
    enabled: true
  - platform: youtube
    name: "@LofiGirl"
    enabled: true

options:
  # Clip geometry — hook-first cuts (viral research: hook in the first 2-3 s,
  # tight 15-60 s clips). Clips are always strictly under 90 seconds.
  clip_length: 25        # default lookback before the peak (floor)
  tail: 10               # seconds recorded after the peak
  max_clip_seconds: 60   # platform sweet spot (system clamps to 90)
  min_clip_seconds: 18   # shorter clips are skipped
  pad_before: 3          # extra seconds before the detected spike
  segment_time: 10       # internal recording chunk size

  # Detection — see README "How clip detection works"
  threshold: 3.0         # fused hype z-score a peak must reach
  cooldown: 120          # minimum seconds between clips (diversity gap)
  window: 60             # scoring window (seconds)
  baseline: 900          # rolling baseline window (seconds)
  min_uptime: 120        # ignore the first N seconds of a capture
  clip_command_trigger: true   # "clip it" chat spam / streamer voice command
  scene_snap: true       # snap clip boundaries to visual scene cuts

  # Peak selection (v3)
  min_signals: 2         # independent signals that must agree
  peak_prominence: 1.0   # how far a peak must stand out from its saddle
  peak_min_distance: 30  # seconds between distinct peaks
  pre_pad: 3             # context seconds before the spike
  reaction_tail: 8       # post-play reaction seconds after the peak

  # Quality gates (v4) — only the BEST of a stream reaches the board
  strong_factor: 1.5     # score ≥ 1.5×threshold cuts instantly, no waiting
  grace_period: 45       # a "lull-best" candidate must stay unbeaten this long
  max_per_hour: 3        # rolling-hour clip quota per channel
  # Latency budget: peak → board must stay inside 3–5 min. Setup on a warm
  # runner is ~40 s; detection+grace ≤ ~60 s; AI ≤ ~25 s; upload ~10–30 s.
  threshold_floor: 2.0   # auto-calibration bounds (quiet decay / quota raise)
  threshold_ceiling: 6.0
  overlap_iou: 0.3       # reject cuts overlapping a recent clip
  quiet_decay: 0.97      # threshold decay step during quiet stretches

  # Intelligence — only real spoken payoffs reach the board
  transcription: true    # Whisper transcript feeds the judge
  whisper_model: small   # tiny | base | small — small is the minimum that
                         # transcribes Hindi/Hinglish well; override with the
                         # repo variable WHISPER_MODEL if needed
  ai_ranking: true       # open-source LLM (Ollama on the runner) judges clips
  ai_min_score: 6.5      # 1-10 virality bar; below this the clip is dropped
  title_template: ""     # title format for every clip, e.g. "🔥 {channel} — {title}"

  # Speed — pickup + idle patience
  probe_timeout: 45      # seconds per channel live-check
  idle_retry_seconds: 600  # idle agents keep looking for 10 min before exiting

  # Storage
  keep_buffer: 900       # seconds of segments kept on disk

  # Google Drive
  drive_remote: gdrive
  drive_folder: StreamClips

  # Scaling
  max_concurrent: 6      # capture agents allowed at the same time
